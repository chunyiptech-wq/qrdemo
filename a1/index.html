<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Bakery 最新 QR Code</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        img { max-width: 100%; height: auto; border: 1px solid #ddd; }
        .time-info { color: #666; margin-top: 15px; font-size: 0.9em; }
        .refresh-btn { margin-top: 20px; padding: 10px 20px; background: #8B4513; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h2>A1 Bakery 會員 QR Code</h2>
        
        <img id="qr-image" src="assets/qr.png" alt="QR Code 加載中...">
        
        <div class="time-info" id="update-time">
            正在取得更新時間...
        </div>

        <button class="refresh-btn" onclick="location.reload()">手動刷新網頁</button>
    </div>

    <script>
        // 1. 自動為圖片加上時間戳，強制瀏覽器抓最新的圖
        const qrImg = document.getElementById('qr-image');
        qrImg.src = "assets/qr.png?t=" + new Date().getTime();

        // 2. 讀取腳本產生的 time.txt 並顯示
        fetch('assets/time.txt?t=' + new Date().getTime())
            .then(response => response.text())
            .then(data => {
                document.getElementById('update-time').innerText = data;
            })
            .catch(err => {
                document.getElementById('update-time').innerText = "無法取得更新時間";
            });
    </script>
</body>
</html>
