<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1 Bakery QR Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background-color: #f4f7f6; color: #333; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: inline-block; max-width: 400px; width: 90%; }
        h2 { margin-top: 0; color: #444; font-size: 1.2rem; }
        img { width: 100%; height: auto; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .timestamp { display: inline-block; background: #ebedef; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; color: #666; }
        .label { font-weight: 600; color: #8B4513; margin-right: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Member QR Code</h2>
        
        <img id="qr-image" src="assets/qr.png" alt="Loading QR Code...">
        
        <div class="timestamp">
            <span class="label">Last updated:</span><span id="update-time">Loading...</span>
        </div>
    </div>

    <script>
        // 強制重新整理圖片，避開瀏覽器暫存
        const qrImg = document.getElementById('qr-image');
        const ts = new Date().getTime();
        qrImg.src = "assets/qr.png?v=" + ts;

        // 讀取 time.txt 內容
        fetch('assets/time.txt?v=' + ts)
            .then(response => response.text())
            .then(data => {
                document.getElementById('update-time').innerText = data.trim();
            })
            .catch(err => {
                document.getElementById('update-time').innerText = "Updating...";
            });

        // 每 60 秒自動刷新整個網頁
        setTimeout(function(){
           location.reload();
        }, 60000);
    </script>
</body>
</html>
