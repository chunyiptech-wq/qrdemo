<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>多店舖 QR Code Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>
  <h1>雲端多店舖 QR Code</h1>
  <div id="qrcodes"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-isk0_uKCxKpjECLCtRGcJxcovVMLiw",
      authDomain: "qrcode1-edd06.firebaseapp.com",
      databaseURL: "https://qrcode1-edd06-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qrcode1-edd06",
      storageBucket: "qrcode1-edd06.appspot.com",
      messagingSenderId: "358063648876",
      appId: "1:358063648876:web:ca24100ee254e026776849",
      measurementId: "G-SRTVH98JVX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 監聽 stores 節點
    const storesRef = ref(db, "stores");
    onValue(storesRef, (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById("qrcodes");
      container.innerHTML = ""; // 清空舊的內容

      if (data) {
        Object.keys(data).forEach((key) => {
          const store = data[key];

          // 建立一個區塊
          const block = document.createElement("div");
          block.style.marginBottom = "20px";

          // 建立 canvas 元素
          const canvas = document.createElement("canvas");
          block.appendChild(canvas);

          // 建立說明文字
          const label = document.createElement("p");
          label.innerText = store.label;
          block.appendChild(label);

          // 生成 QR Code
          new QRious({
            element: canvas,
            value: store.code,
            size: 200,
            level: 'H'
          });

          container.appendChild(block);
        });
      } else {
        container.innerText = "⚠️ 沒有找到任何店舖資料";
      }
    });
  </script>
</body>
</html>
