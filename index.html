<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A1 會員專區</title>
    <style>
        body, html { height: 100%; margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #login { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        input { width: 70%; padding: 15px; border-radius: 12px; border: 1px solid #444; background: #222; color: #fff; font-size: 18px; margin-bottom: 20px; text-align: center; }
        button { width: 75%; padding: 15px; border-radius: 12px; border: none; background: #e84118; color: white; font-size: 18px; font-weight: bold; }
        #qr-view { display: none; width: 100vw; height: 100vh; }
        #qr-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="login">
        <h2 style="margin-bottom: 30px;">授權驗證</h2>
        <input type="password" id="pw" placeholder="請輸入授權碼">
        <button onclick="check()">啟動會員碼</button>
    </div>
    <div id="qr-view">
        <img src="assets/qr.png" id="qr-img">
    </div>
    <script>
        function check() {
            // 隨時可以在這裡修改密碼
            if (document.getElementById('pw').value === "A1HAPPY") {
                document.getElementById('login').style.display = 'none';
                document.getElementById('qr-view').style.display = 'block';
                const img = document.getElementById('qr-img');
                img.src = "assets/qr.png?t=" + new Date().getTime();
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            } else {
                alert("密碼錯誤！");
            }
        }
    </script>
</body>
</html>
